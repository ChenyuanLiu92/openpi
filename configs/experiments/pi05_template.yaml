# OpenPI π0.5 完整、独立实验配置模板
#
# 本文件不继承 config.py 中的任何实验配方。每个可声明的 TrainConfig 字段都在这里
# 明确给出；Python transform 和 NNX filter 通过 type/freeze_mode 白名单安全构造。
#
# 使用方法：
#   1. 复制本文件，修改 name、数据集、权重路径和超参数。
#   2. 计算归一化统计：
#      uv run scripts/compute_norm_stats.py --config configs/experiments/<your_config>.yaml
#   3. 训练（直接使用 YAML 内的 exp_name 和 checkpoint 路径）：
#      uv run scripts/train.py configs/experiments/<your_config>.yaml
#   4. 命令行仍可临时覆盖，例如：
#      uv run scripts/train.py configs/experiments/<your_config>.yaml \
#        --exp-name=lr_test --lr-schedule.peak-lr=0.00001

# YAML schema 版本。目前只支持 1。
schema_version: 1

# 配置名称，对应 checkpoint 路径中的 <config.name>。
name: pi05_libero_standalone

# 模型配置。type 是安全注册表中的组件类型，不是 Python import 路径。
model:
  # pi0 同时承载 π0 和 π0.5；由 pi05 字段切换。另一个可选类型是 pi0_fast。
  type: pi0

  # 模型内部统一动作维度；真实动作不足的部分由数据管线 padding。
  action_dim: 32

  # 每次预测的未来动作数量，即 action chunk 长度。
  action_horizon: 10

  # prompt 和可选离散 state 的最大 token 长度。
  max_token_len: 200

  # JAX 模型内部矩阵计算和 embedding dtype。
  dtype: bfloat16

  # 图像语言主干 Gemma 变体。
  paligemma_variant: gemma_2b

  # 动作专家 Gemma 变体。
  action_expert_variant: gemma_300m

  # true 使用 π0.5，false 使用 π0。
  pi05: true

  # 是否把机器人 state 离散化并放入语言 token；LIBERO 官方配置使用 false。
  discrete_state_input: false

  # PyTorch 推理 torch.compile 模式；JAX 训练不使用。
  pytorch_compile_mode: max-autotune

# 数据配置。type 决定具体 DataConfigFactory 和 Python 数据变换。
data:
  # 可选注册类型包括 lerobot_libero、lerobot_aloha、lerobot_droid、rlds_droid、fake。
  type: lerobot_libero

  # Hugging Face/LeRobot dataset repo id。
  repo_id: physical-intelligence/libero

  # normalization stats 等数据资产的来源。
  assets:
    # null 表示从 paths.assets_base_dir/name 下读取；也可填写本地或 gs:// 路径。
    assets_dir: null

    # stats 子目录 ID；null 时使用 repo_id。
    asset_id: null

  # DataConfigFactory 创建最终 DataConfig 前使用的声明式基础选项。
  base_config:
    # true 使用 LeRobot task 字段作为 prompt。
    prompt_from_task: true

    # 生成 action chunk 时读取的 dataset 字段。
    action_sequence_keys:
      - actions

  # LIBERO action 已经是 delta action，π0.5 通常保持 false。
  extra_delta_transform: false

  # 以下最终 DataConfig 字段由 lerobot_libero 类型自动创建，不能写成任意 Python：
  # norm_stats            从 assets_dir/asset_id 加载；
  # repack_transforms     将 LIBERO dataset 字段映射到 policy 字段；
  # data_transforms       构造统一 Observation/Actions；
  # model_transforms      resize、tokenize 和 padding；
  # use_quantile_norm     π0.5 自动使用 true；
  # rlds_data_dir         仅 rlds_droid 使用；
  # action_space/datasets 仅 rlds_droid 使用。

# 模型初始化权重。
weight_loader:
  # 可选 none、checkpoint、paligemma。
  type: checkpoint

  # checkpoint 类型必填；可使用本地或 gs:// params 目录。
  params_path: gs://openpi-assets/checkpoints/pi05_base/params

# 学习率调度器。
lr_schedule:
  # 可选 cosine_decay 或 rsqrt_decay。
  type: cosine_decay

  # warmup step 数。
  warmup_steps: 10000

  # 峰值学习率。
  peak_lr: 0.00005

  # cosine decay 总 step 数。
  decay_steps: 1000000

  # decay 结束学习率。
  decay_lr: 0.00005

# 优化器。
optimizer:
  # 可选 adamw 或 sgd。
  type: adamw

  # Adam 一阶动量衰减。
  b1: 0.9

  # Adam 二阶动量衰减。
  b2: 0.95

  # 数值稳定项。
  eps: 0.00000001

  # AdamW weight decay。
  weight_decay: 0.0000000001

  # 全局梯度范数裁剪阈值。
  clip_gradient_norm: 1.0

# 训练循环参数。
training:
  # 模型、数据 shuffle 和训练随机数种子。
  seed: 42

  # 全局 batch size，必须能被设备数整除。
  batch_size: 256

  # DataLoader CPU worker 数。
  num_workers: 2

  # 优化器更新总 step 数。
  num_train_steps: 30000

  # JAX EMA 系数；null 表示关闭 EMA。PyTorch trainer 当前不支持 EMA。
  ema_decay: 0.999

  # full 表示全量微调；lora 根据带 _lora 的模型 variant 自动生成 freeze_filter。
  freeze_mode: full

# 本机目录。相对路径以启动 train.py 时的工作目录解析。
paths:
  # normalization stats 根目录。
  assets_base_dir: ./assets

  # checkpoint 根目录。
  checkpoint_base_dir: ./checkpoints

# Checkpoint 与本次 run 配置。
checkpoint:
  # 本次运行名称，对应 checkpoint 路径中的 <exp_name>。
  exp_name: baseline

  # 每多少 step 保存一次；最后一步总会保存。
  save_interval: 1000

  # 永久保留能被该值整除的 checkpoint；null 表示不额外保留。
  keep_period: 5000

  # true 时清空已有同名实验目录。
  overwrite: false

  # true 时从同名实验目录最新 checkpoint 恢复；不能和 overwrite 同时为 true。
  resume: false

# 日志配置。
logging:
  # W&B project 名称。
  project_name: openpi

  # 是否启用 W&B。
  wandb_enabled: true

  # 每多少 step 输出并上传一次聚合指标。
  log_interval: 100

# JAX 多卡配置。
distributed:
  # 每个 FSDP 模型分片组使用的设备数；1 表示不做参数分片。
  fsdp_devices: 1

# PyTorch 专用配置。
pytorch:
  # 已转换的 PyTorch base checkpoint 目录；只跑 JAX 时保持 null。
  weight_path: null

  # 可选 bfloat16 或 float32。
  training_precision: bfloat16

# 随 checkpoint 和 policy server 暴露的自定义元数据；不需要时使用空 mapping。
policy_metadata: {}
