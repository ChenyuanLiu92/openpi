# OpenPI π0.5 预训练完整、独立配置模板
#
# 这个文件不继承 config.py，也不执行任意 Python。所有字段均由严格 schema 校验；
# 未知字段、缺少字段和重复 YAML key 都会直接报错。
#
# 推荐目录：
#   configs/pretraining/pi05/<项目>/<实验>.yaml
#
# 使用流程：
#   1. 复制本文件，修改实验名、RLDS 数据源字段映射、路径和训练超参数。
#   2. 计算每个 normalization_id 的统计量：
#      uv run --group rlds scripts/compute_pretrain_norm_stats.py \
#        configs/pretraining/pi05/<实验>.yaml \
#        --max-frames-per-normalization 1000000
#   3. 启动训练：
#      uv run --group rlds scripts/pretrain.py configs/pretraining/pi05/<实验>.yaml
#   4. 临时覆盖 YAML 值（tyro 会把下划线参数显示为连字符）：
#      uv run --group rlds scripts/pretrain.py configs/pretraining/pi05/<实验>.yaml \
#        --exp-name lr_ablation --optimizer.clip-gradient-norm 0.5

# schema 版本；v2 增加输入流水线、梯度累积、动态混合、精确恢复和通信诊断。
schema_version: 2

# 配置种类；预训练入口只接受 pi05_pretrain。
kind: pi05_pretrain

# 预训练配方名称。资产目录为 <assets_base_dir>/<name>，checkpoint 目录为
# <checkpoint_base_dir>/<name>/<exp_name>。
name: pi05_rlds_pretrain

# π0.5 模型的全部 Pi0Config 字段。
model:
  # π0.5 仍由 pi0 模型类承载，目前预训练不支持 pi0_fast。
  type: pi0

  # 模型矩阵计算和 embedding dtype。
  dtype: bfloat16

  # PaliGemma 视觉语言主干；预训练必须使用非 LoRA 变体。
  paligemma_variant: gemma_2b

  # flow-matching 动作专家；预训练必须使用非 LoRA 变体。
  action_expert_variant: gemma_300m

  # 模型统一 state/action 维度。各数据源不足的维度会补零，并用 action_mask 排除 loss。
  action_dim: 32

  # 每个样本预测的未来动作步数。
  action_horizon: 50

  # prompt 加离散 state 的最大 token 长度。
  max_token_len: 200

  # 必须为 true，启用 π0.5 架构。
  pi05: true

  # π0.5 预训练把 state 离散化后放进语言 token，通常保持 true。
  discrete_state_input: true

  # 仅 PyTorch 推理的 torch.compile 模式；JAX 训练不读取，但属于完整模型配置。
  # 可选 default、reduce-overhead、max-autotune、max-autotune-no-cudagraphs 或 null。
  pytorch_compile_mode: max-autotune

# 初始化方式的全部字段。
initialization:
  # random：全部参数由 seed 随机初始化，不访问网络，适合从零预训练和离线 smoke test。
  # paligemma：只加载官方 PaliGemma 参数，其余 π0.5 参数随机初始化。
  # pi05_checkpoint：加载一个完整 π0.5 params checkpoint，可用于继续预训练/二阶段训练。
  type: paligemma

  # type=random/paligemma 时必须为 null；type=pi05_checkpoint 时必须填写本地或 gs:// params 路径，
  # 例如 gs://openpi-assets/checkpoints/pi05_base/params。
  params_path: null

# RLDS/TFDS sample-level 混合数据配置的全部字段。
data:
  # 当前唯一支持的数据后端。
  type: rlds_mixture

  # 温度采样：source 概率 p_i = weight_i^(1/temperature) / Σ。
  # 1.0 保持原始权重；小于 1 强化大权重；大于 1 让各数据源更均衡。
  temperature: 1.0

  # 每个 host、每个 source 在 repeat 后的 shuffle buffer（以 frame/sample 为单位）。
  shuffle_buffer_size: 100000

  # TFDS 并行读取数；-1 表示 tf.data.AUTOTUNE，正整数表示固定并行度。
  num_parallel_reads: -1

  # trajectory adapter/map/flatten 的并行调用数；-1 表示 AUTOTUNE。
  num_parallel_calls: -1

  # batch 后预取的 batch 数，必须为正整数。
  prefetch_batches: 4

  # Python/host 到 device 的有界输入流水线。
  pipeline:
    # SentencePiece 批量编码使用的 CPU 线程数。
    tokenizer_threads: 8
    # host 内存中提前完成 decode、tokenize 和 NumPy 转换的 batch 数；0 表示同步处理。
    host_prefetch_batches: 4
    # 提前提交到 JAX device 的 batch 数；0 表示仅在消费时提交。
    device_prefetch_batches: 2
    # fail 立即失败；skip 跳过坏 batch；quarantine 跳过并写入脱敏错误记录。
    # 当 mixing.source_failure_policy=degrade 时，source 降级逻辑优先，坏 batch 会被跳过并累计 source 失败次数。
    bad_sample_policy: fail
    # 熔断统计窗口（处理过的 batch 数）。
    bad_sample_window: 1000
    # 窗口内允许的坏 batch 绝对数；fail 策略仍会在第一个错误立即失败。
    max_bad_samples: 10
    # 窗口内允许的坏 batch 比例，超过绝对数或比例任一阈值即熔断。
    max_bad_fraction: 0.01
    # quarantine 策略的 JSONL 目录；记录 source、异常和 prompt 哈希，不写原始图像/文本。
    quarantine_dir: null

  # 动态数据混合策略。静态实验可保留空 schedule。
  mixing:
    # step 在节点处切换；linear 在相邻节点间线性插值温度和权重。
    interpolation: step
    # 每个节点的 step 是 optimizer step；weights 可只覆盖需要改变的 source。
    schedule: []
    # 按 source ID 配置概率边界和整个 run 的样本上下限；未列出的 source 不加约束。
    source_limits: {}
    # fail 在数据源异常时终止；degrade 连续失败达到阈值后在本次 run 中移除该 source 并重归一化。
    source_failure_policy: fail
    consecutive_failure_threshold: 3

  # 所有数据源。需要混训时复制整个 “- id: ...” block；id 必须唯一。
  sources:
    # source 的稳定 ID，用于日志、恢复时的消费计数和验证指标。
    - id: example_robot

      # 传给 tfds.builder 的 builder 名称。数据必须已经注册/转换为 RLDS/TFDS。
      tfds_name: example_robot_dataset

      # TFDS builder 版本。
      version: 1.0.0

      # TFDS data_dir；可以让多个 source 指向同一根目录。
      data_dir: /mnt/bos/dataset/rlds

      # TFDS 训练 split，支持 train、train[:95%] 等 ReadInstruction 字符串。
      train_split: train[:95%]

      # 独立验证 split；训练过程中会按 source 分别报告 loss。
      validation_split: train[95%:]

      # 未经温度变换的正采样权重。
      weight: 1.0

      # 归一化统计资产 ID，路径为 <assets_base_dir>/<name>/<normalization_id>。
      # 多个 source 可共享 ID，但共享时 state_dim 和 action_dim 必须一致；统计量会按混合概率合并。
      normalization_id: example_robot_v1

      # action chunk 中相邻动作的原始数据时间步间隔；1 表示连续未来动作。
      action_stride: 1

      # adapter 拼接后的真实 state 维度，必须 <= model.action_dim。
      state_dim: 8

      # adapter 拼接后的真实 action 维度，必须 <= model.action_dim。
      action_dim: 8

      # 安全 adapter 注册表配置。不能在 YAML 中写 Python import/callable。
      adapter:
        # field_map 用声明式路径读取常见 RLDS 字段；复杂数据集可在
        # openpi.training.rlds_adapters 中注册经过代码审查的新 adapter 名称。
        type: field_map

        # field_map 的全部必填选项。
        options:
          # 把原始图像字段映射到 OpenPI 三个固定相机槽位。
          images:
            # 主相机必填，支持 “observation/image” 形式的嵌套路径，也支持包含 / 的字面 key。
            base_0_rgb: observation/image

            # 缺少某个腕部相机时写 null；loader 会补零图像并把 image_mask 设为 false。
            left_wrist_0_rgb: observation/wrist_image
            right_wrist_0_rgb: null

          # state 字段路径列表；多项会按最后一维依次拼接，总维度必须等于 state_dim。
          state:
            - observation/state

          # action 字段路径列表；多项会按最后一维依次拼接，总维度必须等于 action_dim。
          actions:
            - action

          # 语言指令路径。可以是每条 trajectory 一个 scalar string，或每个时间步一个 [T] string。
          prompt: task/language_instruction

          # 原始图像数值范围：uint8=[0,255]、zero_one=[0,1]、minus_one_one=[-1,1]。
          image_range: uint8

# 学习率调度器的全部字段。
lr_schedule:
  # 可选 cosine_decay 或 rsqrt_decay；不同类型所需字段不同。本模板完整展示 cosine_decay。
  type: cosine_decay

  # 从近零学习率线性 warmup 到 peak_lr 的 optimizer step 数。
  warmup_steps: 10000

  # 峰值学习率。
  peak_lr: 0.00005

  # 从训练开始计的 warmup+cosine 总步数；通常与 num_train_steps 一致。
  decay_steps: 1000000

  # cosine 结束时的学习率。
  decay_lr: 0.000005

# 优化器的全部字段。
optimizer:
  # 可选 adamw 或 sgd；大规模 π0.5 预训练推荐 adamw。
  type: adamw

  # Adam 一阶矩衰减。
  b1: 0.9

  # Adam 二阶矩衰减。
  b2: 0.95

  # 数值稳定项。
  eps: 0.00000001

  # 解耦 weight decay。设为极小非零值可保持与 OpenPI 默认优化器一致。
  weight_decay: 0.0000000001

  # 全局梯度范数裁剪阈值。
  clip_gradient_norm: 1.0

# 训练循环的全部字段。
training:
  # 模型、flow matching 和 RLDS shuffle 的基础随机种子。
  seed: 42

  # 所有 host/device 合计的全局 batch size，必须能被全局 JAX device 数整除。
  batch_size: 256

  # 每张 device 每个 microstep 的样本数；null 表示兼容旧行为（每步只做一次前后向）。
  # 非 null 时必须满足 batch_size = micro_batch_size × 全局 device 数 × gradient_accumulation_steps。
  micro_batch_size: 4

  # 累积多少个 microbatch 后才更新 optimizer/EMA/step。
  gradient_accumulation_steps: 8

  # optimizer 更新总步数。
  num_train_steps: 1000000

  # 参数 EMA 系数；null 表示关闭。checkpoint 会同时精确恢复 EMA。
  ema_decay: 0.999

# 本机或共享文件系统路径。相对路径以启动脚本时的工作目录解析。
paths:
  # normalization stats 根目录；实际目录还会拼接 name/normalization_id。
  assets_base_dir: ./assets/pretraining

  # checkpoint 根目录；实际目录还会拼接 name/exp_name。
  checkpoint_base_dir: ./checkpoints/pretraining

# checkpoint/run 的全部字段。
checkpoint:
  # 本次运行名，对应 checkpoint 路径中的 <exp_name>，因此不需要再从命令行传。
  exp_name: baseline

  # 每多少个已完成 optimizer step 保存一次；最后一步一定保存。
  save_interval: 1000

  # 被该值整除的 checkpoint 永久保留；null 表示仅保留最新 checkpoint。
  keep_period: 10000

  # true 会清空同名 checkpoint 目录。不要和 resume 同时打开。
  overwrite: false

  # true 从最新 checkpoint 精确恢复 model/optimizer/EMA/step；数据流按记录计数做统计恢复。
  resume: false

  # statistical 只恢复采样统计；exact 在相同进程/device 拓扑下恢复确定性 mixer/iterator 位置。
  data_resume_mode: exact

  # exact checkpoint 遇到不同拓扑时：error 拒绝启动；statistical 明确降级为统计恢复。
  on_topology_change: statistical

# 日志的全部字段。
logging:
  # W&B project 名称。
  project_name: openpi-pretraining

  # 是否启用 W&B；false 时仍输出本地 tqdm/log。
  wandb_enabled: true

  # online 写入 W&B Cloud；offline 仅生成可由 wandb sync 上传的本地记录；disabled 完全关闭。
  wandb_mode: online

  # 可选 W&B entity/team；null 使用当前登录账号的默认 entity。
  wandb_entity: null

  # PFS 观测日志根目录；null 默认写到 <checkpoint_dir>/observability。
  local_root: null

  # W&B run tags。
  tags: [pi05, rlds, pretraining]

  # 多少 optimizer step 聚合并记录一次训练指标。
  log_interval: 100

  # CPU/GPU/PFS 指标采样与 heartbeat 周期。
  system_interval_seconds: 10
  heartbeat_interval_seconds: 60

  # training phase 内多久没有 optimizer step 判定为 stall。
  stall_timeout_seconds: 600
  emergency_checkpoint_timeout_seconds: 120

  # Webhook URL 只从该环境变量读取，绝不进入配置快照。
  webhook_url_env: OPENPI_TRAIN_ALERT_WEBHOOK_URL

  # PFS 剩余空间阈值与高频原始系统日志保留天数。
  min_free_space_gib: 500
  raw_retention_days: 90

# JAX 进程运行时配置。JAX_* 同名环境变量可在不修改 YAML 的情况下临时覆盖缓存字段。
runtime:
  compilation_cache:
    # 是否启用 JAX 持久编译缓存。
    enabled: true

    # 缓存目录。单机可使用本地盘；真实多节点要让所有 rank 复用缓存时必须指向共享 PFS。
    directory: ~/.cache/jax

    # 只缓存编译耗时达到该阈值的 executable，单位秒；0 表示缓存所有条目。
    minimum_compile_time_seconds: 1.0

    # true 时输出持久缓存 miss 原因，建议只在调试时打开。
    explain_misses: false

  # 未捕获异常后用于刷新 observer/W&B/log 并关闭 JAX distributed runtime 的最长时间。
  # 超时后进程会硬退出，确保 launcher 能回收其他 rank。
  fatal_cleanup_timeout_seconds: 15.0

# 原生 JAX 单机/多机配置的全部字段。
distributed:
  # FSDP 轴设备数。1 表示参数不分片；必须整除全局 device 数。
  fsdp_devices: 1

  # 是否在加载大模型/checkpoint 前运行一次带数值校验的 JAX AllReduce、AllGather 和 ReduceScatter。
  # 多进程时先检查每个 rank 的本地设备，再检查覆盖整个 global mesh 的跨 rank collective。
  # 推荐保持 true：新 GPU 架构或空 CUDA driver cache 上第一次 NCCL/PTX JIT 可能耗时几十秒；
  # 此时 XLA 在 10 秒后打印的 “rendezvous ... may be stuck” 是进度告警，不等于死锁。
  warmup_collectives: true

  # 单机由 launcher 已完成初始化时保持 false；原生多 host 且 launcher 未初始化时设 true。
  initialize: false

  # 显式多 host 初始化的 coordinator “host:port”；使用自动集群检测时写 null。
  coordinator_address: null

  # coordinator 在 process 0 上监听的地址；多网卡节点可写 [::]:12345 或指定内网 IP，通常保持 null。
  coordinator_bind_address: null

  # 多 host 总进程数；使用自动集群检测时写 null。
  num_processes: null

  # 当前进程的全局 ID（从 0 开始）；使用自动集群检测时写 null。
  process_id: null

  # 当前进程可使用的本地 device ID；null 表示使用 launcher/JAX 默认值。
  local_device_ids: null

  # JAX 自动集群检测方法，例如 mpi4py、slurm；显式填写上述三项时写 null。
  cluster_detection_method: null

  # jax.distributed.initialize 超时时间，单位秒。
  initialization_timeout: 300

  # 启动和运行期间的通信性能诊断。
  diagnostics:
    # 检查 GPU/NIC/NUMA 可见性和常见 NCCL 网卡绑定错误。
    topology_check: true
    # 对每种 payload 测 AllReduce、AllGather、ReduceScatter；单位 MiB。
    tensor_sizes_mib: [1, 16, 64, 256]
    # 每种 collective/size 的预热次数和计时次数。
    warmup_iterations: 2
    measure_iterations: 5
    # 最慢 rank 耗时 / rank 中位数超过该值时报告 straggler。
    straggler_ratio_threshold: 1.5
    # 非 null 时从指定 optimizer step 开始写 JAX profiler trace。
    profile_start_step: null
    # trace 覆盖的 optimizer step 数，用于分析真实通信/计算 overlap。
    profile_num_steps: 5

# validation 的全部字段。
validation:
  # 每多少训练 step 运行一次逐 source validation。
  interval_steps: 1000

  # 每个 source 每次验证读取多少个完整 global batch。
  batches_per_source: 10

# 会记录进 resolved snapshot，供部署/评估工具使用的自定义 JSON/YAML 元数据。
policy_metadata:
  model_family: pi0.5
  training_stage: pretraining
